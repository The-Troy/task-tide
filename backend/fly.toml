# fly.toml — tasktide-api (Laravel backend)
app = "tasktide-api"
primary_region = "jnb"  # Johannesburg — closest to Nairobi. Change to 'mba' for Mumbai or 'cdg' for Paris.

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV      = "production"
  APP_DEBUG    = "false"
  LOG_CHANNEL  = "stderr"
  LOG_LEVEL    = "error"
  DB_CONNECTION = "pgsql"
  CACHE_DRIVER  = "redis"
  QUEUE_CONNECTION = "database"
  SESSION_DRIVER   = "database"
  REVERB_HOST  = "0.0.0.0"
  REVERB_PORT  = "8080"
  REVERB_SCHEME = "http"

# Run migrations before new version starts taking traffic
[deploy]
  release_command = "php artisan migrate --force"

[[services]]
  internal_port = 8000
  protocol      = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port     = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [services.concurrency]
    type       = "connections"
    hard_limit = 200
    soft_limit = 150

  [[services.tcp_checks]]
    interval     = "15s"
    timeout      = "2s"
    grace_period = "30s"

# Laravel Reverb WebSocket service
[[services]]
  internal_port = 8080
  protocol      = "tcp"

  [[services.ports]]
    handlers = ["tls"]
    port     = 443  # fly.io routes wss:// upgrade on this port

  [[services.tcp_checks]]
    interval     = "15s"
    timeout      = "2s"
    grace_period = "30s"

[mounts]
  # Persist Laravel storage (logs, file uploads, etc.)
  source      = "tasktide_storage"
  destination = "/var/www/storage/app"
